version: '3'

vars:
  APP_NAME: "nexora"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # The nexora-extensions checkout (SDK + extensions): a sibling folder unless
  # NEXORA_EXTENSIONS_REPO says otherwise.
  EXTENSIONS_REPO:
    sh: 'cd "${NEXORA_EXTENSIONS_REPO:-{{.ROOT_DIR}}/../nexora-extensions}" 2>/dev/null && pwd || echo "${NEXORA_EXTENSIONS_REPO:-{{.ROOT_DIR}}/../nexora-extensions}"'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode (loads the nexora-extensions checkout)
    deps: [build:extensions]
    env:
      NEXORA_DEV_EXTENSIONS: "{{.EXTENSIONS_REPO}}/extensions"
      # The local `pnpm release` output, so the + panel works offline in dev.
      NEXORA_REGISTRY_URL: '{{.NEXORA_REGISTRY_URL | default (print "file://" .EXTENSIONS_REPO "/release/index.json")}}'
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:extensions:
    summary: Builds the SDK and every extension in the nexora-extensions checkout
    dir: "{{.EXTENSIONS_REPO}}"
    sources:
      - sdk/*/src/**/*
      - extensions/*/src/**/*
      - extensions/*/nexora.json
    preconditions:
      - sh: test -f "{{.EXTENSIONS_REPO}}/package.json"
        msg: "nexora-extensions not found at {{.EXTENSIONS_REPO}}; clone it next to this repo or set NEXORA_EXTENSIONS_REPO"
    cmds:
      - pnpm install
      - pnpm build

  test:
    summary: Runs Go tests (extension end-to-end tests need build:extensions)
    deps: [build:extensions]
    env:
      NEXORA_EXTENSIONS_REPO: "{{.EXTENSIONS_REPO}}"
    cmds:
      - go test {{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}}{{end}} ./internal/...

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
